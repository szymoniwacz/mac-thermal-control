name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adapter-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Verify executable scripts
        shell: bash
        run: |
          test "$(git ls-files --stage scripts/setup-ai-workflow.sh | awk '{print $1}')" = "100755"
          test "$(git ls-files --stage scripts/check-workflow-leak.sh | awk '{print $1}')" = "100755"
          test "$(git ls-files --stage scripts/ai-workflow-doctor.sh | awk '{print $1}')" = "100755"
          test "$(git ls-files --stage scripts/update-ai-workflow.sh | awk '{print $1}')" = "100755"
          test "$(git ls-files --stage tests/test-adapter.sh | awk '{print $1}')" = "100755"

      - name: Shell syntax
        shell: bash
        run: bash -n scripts/*.sh tests/test-adapter.sh

      - name: Adapter contract tests
        shell: bash
        run: bash tests/test-adapter.sh

      - name: Workflow leak check
        shell: bash
        run: bash scripts/check-workflow-leak.sh

  product-contract:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Record compiler version
        run: swift --version
      - name: Build SwiftPM CLI and fixture test runner
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run synthetic contract cases
        run: swift run --skip-build ContractTests
      - name: Build and test Intel macOS 12 artifact without XCTest
        run: bash scripts/test-product.sh
